name: Release plugin

on:
  push:
    tags:
      - "monitor-v*"
      - "agent-v*"
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - monitor
          - agent
      version:
        description: Version without the v prefix (for example 1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release target
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PLUGIN: ${{ inputs.plugin }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            case "$REF_NAME" in
              monitor-v*)
                plugin="monitor"
                version="${REF_NAME#monitor-v}"
                ;;
              agent-v*)
                plugin="agent"
                version="${REF_NAME#agent-v}"
                ;;
              *)
                echo "Unsupported release tag: $REF_NAME" >&2
                exit 64
                ;;
            esac
          else
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from main, not $REF." >&2
              exit 65
            fi

            plugin="$INPUT_PLUGIN"
            version="${INPUT_VERSION#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 64
          fi

          case "$plugin" in
            monitor)
              slug="od-wordpress-monitor"
              release_repository="od-wordpress-monitor-release"
              ;;
            agent)
              slug="od-monitor-agent"
              release_repository="od-monitor-agent-release"
              ;;
            *)
              echo "Unsupported plugin: $plugin" >&2
              exit 64
              ;;
          esac

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "release_repository=$release_repository" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify source commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Run coding standards
        run: composer lint

      - name: Start WordPress test environment
        run: npm run env:test:start

      - name: Run PHPUnit
        run: npm run test:php

      - name: Stop WordPress test environment
        if: always()
        run: npm run env:test:stop

      - name: Start minimum-version test environment
        run: npm run env:test:wp68:start

      - name: Run minimum-version PHPUnit
        run: npm run test:php:wp68

      - name: Stop minimum-version test environment
        if: always()
        run: npm run env:test:wp68:stop

      - name: Build distribution archive
        env:
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/build-plugin-release.sh "$PLUGIN" "$VERSION" "$RUNNER_TEMP/release"

      - name: Smoke-test distribution archive
        env:
          PLUGIN: ${{ steps.release.outputs.plugin }}
          VERSION: ${{ steps.release.outputs.version }}
          SLUG: ${{ steps.release.outputs.slug }}
        run: ./scripts/verify-plugin-release.sh "$PLUGIN" "$VERSION" "$RUNNER_TEMP/release/$SLUG.zip"

      - name: Create distribution token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Olein-jp
          repositories: |
            od-monitor-agent-release
            od-wordpress-monitor-release

      - name: Publish distribution repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ steps.release.outputs.release_repository }}
          SLUG: ${{ steps.release.outputs.slug }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          release_repo="Olein-jp/$RELEASE_REPOSITORY"
          release_tag="v$VERSION"
          checkout_directory="$RUNNER_TEMP/distribution-repository"
          package_directory="$RUNNER_TEMP/release/$SLUG"
          archive_path="$RUNNER_TEMP/release/$SLUG.zip"
          checksum_path="$archive_path.sha256"

          if gh release view "$release_tag" --repo "$release_repo" >/dev/null 2>&1; then
            echo "Release already exists: $release_repo@$release_tag" >&2
            exit 73
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${release_repo}.git" "$checkout_directory"

          if git -C "$checkout_directory" rev-parse --verify HEAD >/dev/null 2>&1; then
            git -C "$checkout_directory" switch main
          else
            git -C "$checkout_directory" switch --orphan main
          fi

          rsync -a --delete --exclude '/.git/' "$package_directory/" "$checkout_directory/"

          git -C "$checkout_directory" config user.name "github-actions[bot]"
          git -C "$checkout_directory" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$checkout_directory" add -A

          if ! git -C "$checkout_directory" diff --cached --quiet; then
            if git -C "$checkout_directory" rev-parse "refs/tags/$release_tag" >/dev/null 2>&1; then
              echo "Tag already exists but distribution contents differ: $release_tag" >&2
              exit 73
            fi

            git -C "$checkout_directory" commit -m "release: $release_tag"
            git -C "$checkout_directory" push origin main
          fi

          if git -C "$checkout_directory" rev-parse "refs/tags/$release_tag" >/dev/null 2>&1; then
            tag_commit="$(git -C "$checkout_directory" rev-list -n 1 "$release_tag")"
            head_commit="$(git -C "$checkout_directory" rev-parse HEAD)"

            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Tag exists on a different distribution commit: $release_tag" >&2
              exit 73
            fi
          else
            git -C "$checkout_directory" tag -a "$release_tag" -m "Release $release_tag"
            git -C "$checkout_directory" push origin "refs/tags/$release_tag"
          fi

          checksum="$(awk '{ print $1 }' "$checksum_path")"
          gh release create "$release_tag" "$archive_path" \
            --repo "$release_repo" \
            --verify-tag \
            --latest \
            --title "$release_tag" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. SHA-256: ${checksum}"
